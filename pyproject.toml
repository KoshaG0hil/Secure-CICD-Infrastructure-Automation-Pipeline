[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-cicd-pipeline"
version = "1.2.0"
description = "Secure CI/CD & Infrastructure Automation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.2",
    "werkzeug==3.1.3",
    "pydantic==2.12.4",
    "requests==2.32.5",
    "rich==14.2.0",
    "streamlit==1.51.0"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
